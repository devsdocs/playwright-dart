# Test configuration file for Playwright Dart
launchOptions:
  headless: true
  channel: chrome
  timeout: 30000
contextOptions:
  viewport:
    width: 1280
    height: 720
  userAgent: "Test User Agent"
  locale: "en-US"
test:
  testDir: "test"
  timeout: 60000
timeout:
  defaultTimeout: 30000
  actionTimeout: 10000
retry:
  retries: 2
outputDir: "test-results"
fullyParallel: false
workers: 1
