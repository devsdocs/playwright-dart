name: playwright_dart
description: >-
  A Dart port of Playwright — browser automation for Chromium, Firefox, and
  WebKit. Covers the core Playwright API targeting protocol v1.61.0.
version: 3.8.0
homepage: https://playwright.dev
repository: https://github.com/devsdocs/playwright-dart
issue_tracker: https://github.com/devsdocs/playwright-dart/issues
topics:
  - testing
  - browser
  - automation
  - e2e
  - playwright
platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.12.0

dependencies:
  path: ^1.9.1
  archive: ^4.0.9
  http: ^1.6.0
  yaml: ^3.1.3
  html: ^0.15.6

dev_dependencies:
  analyzer: ^13.3.0
  lints: ^6.1.0
  test: ^1.31.1
