name: playwright_dart
description: >-
  A complete Dart port of Playwright — fast, reliable browser automation
  for Chromium, Firefox, and WebKit with full API parity to Node.js v1.60.0.
version: 0.1.2
homepage: https://playwright.dev
repository: https://github.com/devsdocs/playwright-dart
issue_tracker: https://github.com/devsdocs/playwright-dart/issues
topics:
  - testing
  - browser
  - automation
  - e2e
  - playwright

environment:
  sdk: ^3.12.0

dependencies:
  path: ^1.9.1
  archive: ^4.0.9
  http: ^1.6.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
