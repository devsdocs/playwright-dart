name: playwright_dart
description: >-
  A complete Dart port of Playwright — fast, reliable browser automation
  for Chromium, Firefox, and WebKit with full API parity to Node.js v1.60.0.
version: 0.1.0
homepage: https://playwright.dev
repository: https://github.com/anthropics/playwright-dart
issue_tracker: https://github.com/anthropics/playwright-dart/issues
topics:
  - testing
  - browser
  - automation
  - e2e
  - playwright

environment:
  sdk: ^3.12.0

dependencies:
  path: ^1.9.0
  archive: ^3.4.10
  http: ^1.2.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
